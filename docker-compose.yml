services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homechef
      POSTGRES_PASSWORD: homechef
      POSTGRES_DB: homechef
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homechef"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://homechef:homechef@db:5432/homechef
      SECRET_KEY: change-this-in-production-use-a-real-secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
